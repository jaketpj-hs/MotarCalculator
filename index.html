```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Distance XY</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta name="theme-color" content="#101010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Distance XY">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #101010;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding:
        max(10px, env(safe-area-inset-top))
        10px
        max(10px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =========================
       RESULTAT
       ========================= */

    .result {
      position: sticky;
      top: 0;
      z-index: 20;

      background: #1b1b1b;
      border: 1px solid #3b3b3b;
      border-radius: 14px;

      padding: 10px;
      margin-bottom: 10px;

      text-align: center;
    }

    .result-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.65;
      margin-bottom: 3px;
    }

    .result-value {
      font-size: clamp(32px, 9vw, 48px);
      font-weight: 700;
      line-height: 1;
    }

    .result-unit {
      font-size: 19px;
      font-weight: 400;
      opacity: 0.75;
    }


    /* =========================
       BOUSSOLE
       ========================= */

    .compass-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;

      margin-top: 10px;
    }

    .compass {
      position: relative;

      width: 92px;
      height: 92px;

      border: 2px solid #777;
      border-radius: 50%;

      background: #121212;
    }

    .compass-letter {
      position: absolute;

      font-size: 11px;
      font-weight: 700;
      opacity: 0.7;
    }

    .north {
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .south {
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
    }

    .east {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .west {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-center {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: white;

      transform: translate(-50%, -50%);

      z-index: 3;
    }

    .needle {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 4px;
      height: 68px;

      transform:
        translate(-50%, -50%)
        rotate(0deg);

      transform-origin: center center;

      transition: transform 0.15s ease-out;

      z-index: 2;
    }

    .needle::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 34px solid #ffffff;
    }

    .needle::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: 3px;
      height: 32px;

      background: #555;
    }

    .heading-info {
      text-align: left;
      min-width: 110px;
    }

    .heading-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    .heading-value {
      font-size: 26px;
      font-weight: 700;
    }


    /* =========================
       CHAMPS
       ========================= */

    .coordinates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      background: #181818;
      border: 1px solid #343434;
      border-radius: 12px;
      padding: 7px;
    }

    label {
      display: block;

      font-size: 12px;
      font-weight: bold;

      opacity: 0.65;

      margin: 0 0 4px 3px;
    }

    input {
      display: block;

      width: 100%;
      height: 56px;

      border: 2px solid transparent;
      border-radius: 9px;

      background: #242424;
      color: #ffffff;

      font-size: 26px;
      font-weight: 600;
      text-align: center;

      padding: 5px;

      outline: none;
    }

    input:focus {
      border-color: #ffffff;
      background: #2d2d2d;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }


    /* =========================
       DETAILS
       ========================= */

    .details {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      margin-top: 8px;
    }

    .detail {
      flex: 1;

      background: #181818;
      border: 1px solid #343434;
      border-radius: 10px;

      padding: 8px;

      text-align: center;
    }

    .detail-label {
      font-size: 11px;
      opacity: 0.55;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 17px;
      font-weight: 600;
    }


    /* =========================
       RESET
       ========================= */

    .reset {
      width: 100%;
      height: 40px;

      margin-top: 8px;

      border: 1px solid #343434;
      border-radius: 10px;

      background: transparent;
      color: #aaaaaa;

      font-size: 14px;

      cursor: pointer;
    }

    .reset:active {
      background: #222222;
    }

  </style>
</head>

<body>

  <main class="app">


    <section class="result">

      <div class="result-label">
        Distance
      </div>

      <div class="result-value">
        <span id="distance">—</span>
        <span class="result-unit">m</span>
      </div>


      <div class="compass-area">

        <div class="compass">

          <span class="compass-letter north">N</span>
          <span class="compass-letter east">E</span>
          <span class="compass-letter south">S</span>
          <span class="compass-letter west">W</span>

          <div
            class="needle"
            id="needle"
          ></div>

          <div class="compass-center"></div>

        </div>


        <div class="heading-info">

          <div class="heading-label">
            Orientation
          </div>

          <div class="heading-value">
            <span id="heading">—</span>
          </div>

        </div>

      </div>

    </section>



    <section class="coordinates">

      <div class="field">

        <label for="x1">X1</label>

        <input
          id="x1"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label for="y1">Y1</label>

        <input
          id="y1"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label for="x2">X2</label>

        <input
          id="x2"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label for="y2">Y2</label>

        <input
          id="y2"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="done"
          autocomplete="off"
          placeholder="0"
        >

      </div>

    </section>



    <section class="details">

      <div class="detail">

        <div class="detail-label">
          ΔX
        </div>

        <div class="detail-value">
          <span id="xdiff">—</span> m
        </div>

      </div>


      <div class="detail">

        <div class="detail-label">
          ΔY
        </div>

        <div class="detail-value">
          <span id="ydiff">—</span> m
        </div>

      </div>

    </section>


    <button
      class="reset"
      id="reset"
      type="button"
    >
      Effacer
    </button>


  </main>



  <script>

    const inputs = [
      document.getElementById("x1"),
      document.getElementById("y1"),
      document.getElementById("x2"),
      document.getElementById("y2")
    ];


    const distanceElement =
      document.getElementById("distance");

    const xdiffElement =
      document.getElementById("xdiff");

    const ydiffElement =
      document.getElementById("ydiff");

    const headingElement =
      document.getElementById("heading");

    const needleElement =
      document.getElementById("needle");

    const resetButton =
      document.getElementById("reset");



    function getDirection(angle) {

      const directions = [
        "N",
        "NE",
        "E",
        "SE",
        "S",
        "SW",
        "W",
        "NW"
      ];

      const index =
        Math.round(angle / 45) % 8;

      return directions[index];

    }



    function calculateDistance() {

      const allFilled = inputs.every(
        input => input.value.trim() !== ""
      );


      if (!allFilled) {

        distanceElement.textContent = "—";

        xdiffElement.textContent = "—";

        ydiffElement.textContent = "—";

        headingElement.textContent = "—";

        needleElement.style.transform =
          "translate(-50%, -50%) rotate(0deg)";

        return;

      }


      const x1 =
        parseFloat(inputs[0].value);

      const y1 =
        parseFloat(inputs[1].value);

      const x2 =
        parseFloat(inputs[2].value);

      const y2 =
        parseFloat(inputs[3].value);



      if (
        !Number.isFinite(x1) ||
        !Number.isFinite(y1) ||
        !Number.isFinite(x2) ||
        !Number.isFinite(y2)
      ) {

        return;

      }



      /* =========================
         DIFFERENCES
         ========================= */

      const rawXDiff =
        x2 - x1;

      const rawYDiff =
        y2 - y1;


      const xdiff =
        Math.abs(rawXDiff) * 100;

      const ydiff =
        Math.abs(rawYDiff) * 100;



      /* =========================
         DISTANCE
         ========================= */

      const distance =
        Math.hypot(xdiff, ydiff);



      /* =========================
         ANGLE / AZIMUT
         
         0°   = Nord
         90°  = Est
         180° = Sud
         270° = Ouest
         ========================= */

      let angle =
        Math.atan2(
          rawXDiff,
          rawYDiff
        ) * 180 / Math.PI;


      if (angle < 0) {
        angle += 360;
      }


      const roundedAngle =
        Math.round(angle);


      const direction =
        getDirection(angle);



      /* =========================
         AFFICHAGE
         ========================= */

      distanceElement.textContent =
        distance.toFixed(2);


      xdiffElement.textContent =
        xdiff.toFixed(2);


      ydiffElement.textContent =
        ydiff.toFixed(2);


      headingElement.textContent =
        roundedAngle + "° " + direction;



      /* =========================
         AIGUILLE
         ========================= */

      needleElement.style.transform =
        `translate(-50%, -50%) rotate(${angle}deg)`;

    }



    inputs.forEach(
      (input, index) => {

        input.addEventListener(
          "input",
          calculateDistance
        );


        input.addEventListener(
          "focus",
          () => {

            setTimeout(
              () => input.select(),
              50
            );

          }
        );


        input.addEventListener(
          "keydown",
          event => {

            if (event.key !== "Enter") {
              return;
            }


            event.preventDefault();


            if (
              index <
              inputs.length - 1
            ) {

              const nextInput =
                inputs[index + 1];

              nextInput.focus();


              setTimeout(
                () => nextInput.select(),
                50
              );

            }

            else {

              input.blur();

            }

          }
        );

      }
    );



    resetButton.addEventListener(
      "click",
      () => {

        inputs.forEach(
          input => input.value = ""
        );

        calculateDistance();

        inputs[0].focus();

      }
    );



    /* =========================
       SERVICE WORKER
       ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "./service-worker.js"
          );

        }
      );

    }



    calculateDistance();

  </script>

</body>
</html>
