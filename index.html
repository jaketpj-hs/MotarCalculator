<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#101010">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Distance XY">

<link rel="apple-touch-icon" href="icon-192.png">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Distance XY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #101010;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding:
        max(10px, env(safe-area-inset-top))
        10px
        max(10px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       RESULTAT
       ========================= */

    .result {
      position: sticky;
      top: 0;
      z-index: 20;

      background: #1b1b1b;
      border: 1px solid #3b3b3b;
      border-radius: 14px;

      padding: 12px 10px;
      margin-bottom: 10px;

      text-align: center;
    }

    .result-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.65;
      margin-bottom: 3px;
    }

    .result-value {
      font-size: clamp(34px, 10vw, 52px);
      font-weight: 700;
      line-height: 1;
    }

    .result-unit {
      font-size: 20px;
      font-weight: 400;
      opacity: 0.75;
    }

    /* =========================
       CHAMPS
       ========================= */

    .coordinates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      background: #181818;
      border: 1px solid #343434;
      border-radius: 12px;
      padding: 7px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      opacity: 0.65;
      margin: 0 0 4px 3px;
    }

    input {
      display: block;
      width: 100%;
      height: 56px;

      border: 2px solid transparent;
      border-radius: 9px;

      background: #242424;
      color: #ffffff;

      font-size: 26px;
      font-weight: 600;
      text-align: center;

      padding: 5px;

      outline: none;
    }

    input:focus {
      border-color: #ffffff;
      background: #2d2d2d;
    }

    /* enlève les flèches number sur certains navigateurs */

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* =========================
       DETAILS
       ========================= */

    .details {
      display: flex;
      justify-content: space-between;
      gap: 8px;

      margin-top: 8px;
    }

    .detail {
      flex: 1;

      background: #181818;
      border: 1px solid #343434;
      border-radius: 10px;

      padding: 8px;
      text-align: center;
    }

    .detail-label {
      font-size: 11px;
      opacity: 0.55;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 17px;
      font-weight: 600;
    }

    /* =========================
       RESET
       ========================= */

    .reset {
      width: 100%;
      height: 40px;

      margin-top: 8px;

      border: 1px solid #343434;
      border-radius: 10px;

      background: transparent;
      color: #aaaaaa;

      font-size: 14px;

      cursor: pointer;
    }

    .reset:active {
      background: #222222;
    }

  </style>
</head>

<body>

  <main class="app">

    <section class="result">

      <div class="result-label">
        Distance
      </div>

      <div class="result-value">
        <span id="distance">—</span>
        <span class="result-unit">m</span>
      </div>

    </section>


    <section class="coordinates">

      <div class="field">
        <label for="x1">X1</label>

        <input
          id="x1"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >
      </div>


      <div class="field">
        <label for="y1">Y1</label>

        <input
          id="y1"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >
      </div>


      <div class="field">
        <label for="x2">X2</label>

        <input
          id="x2"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="next"
          autocomplete="off"
          placeholder="0"
        >
      </div>


      <div class="field">
        <label for="y2">Y2</label>

        <input
          id="y2"
          type="number"
          inputmode="decimal"
          step="any"
          enterkeyhint="done"
          autocomplete="off"
          placeholder="0"
        >
      </div>

    </section>


    <section class="details">

      <div class="detail">

        <div class="detail-label">
          ΔX
        </div>

        <div class="detail-value">
          <span id="xdiff">—</span> m
        </div>

      </div>


      <div class="detail">

        <div class="detail-label">
          ΔY
        </div>

        <div class="detail-value">
          <span id="ydiff">—</span> m
        </div>

      </div>

    </section>


    <button
      class="reset"
      id="reset"
      type="button"
    >
      Effacer
    </button>

  </main>


  <script>

    const inputs = [
      document.getElementById("x1"),
      document.getElementById("y1"),
      document.getElementById("x2"),
      document.getElementById("y2")
    ];


    const distanceElement =
      document.getElementById("distance");

    const xdiffElement =
      document.getElementById("xdiff");

    const ydiffElement =
      document.getElementById("ydiff");

    const resetButton =
      document.getElementById("reset");


    function calculateDistance() {

      /*
        On attend que les 4 valeurs
        soient renseignées avant
        d'afficher un résultat.
      */

      const allFilled = inputs.every(
        input => input.value.trim() !== ""
      );


      if (!allFilled) {

        distanceElement.textContent = "—";
        xdiffElement.textContent = "—";
        ydiffElement.textContent = "—";

        return;
      }


      const x1 = parseFloat(inputs[0].value);
      const y1 = parseFloat(inputs[1].value);
      const x2 = parseFloat(inputs[2].value);
      const y2 = parseFloat(inputs[3].value);


      if (
        !Number.isFinite(x1) ||
        !Number.isFinite(y1) ||
        !Number.isFinite(x2) ||
        !Number.isFinite(y2)
      ) {

        return;

      }


      /*
        Conversion en mètres
      */

      const xdiff =
        Math.abs(x1 - x2) * 100;

      const ydiff =
        Math.abs(y1 - y2) * 100;


      /*
        Théorème de Pythagore
      */

      const distance =
        Math.hypot(xdiff, ydiff);


      distanceElement.textContent =
        distance.toFixed(2);

      xdiffElement.textContent =
        xdiff.toFixed(2);

      ydiffElement.textContent =
        ydiff.toFixed(2);

    }


    inputs.forEach((input, index) => {

      /*
        Recalcul instantané
        à chaque caractère tapé
      */

      input.addEventListener(
        "input",
        calculateDistance
      );


      /*
        Sélection automatique
        du contenu lorsqu'on
        arrive dans un champ.
      */

      input.addEventListener(
        "focus",
        () => {

          setTimeout(
            () => input.select(),
            50
          );

        }
      );


      /*
        Entrée / Suivant
        -> champ suivant
      */

      input.addEventListener(
        "keydown",
        event => {

          if (event.key !== "Enter") {
            return;
          }


          event.preventDefault();


          if (index < inputs.length - 1) {

            const nextInput =
              inputs[index + 1];

            nextInput.focus();


            setTimeout(
              () => nextInput.select(),
              50
            );

          }

          else {

            /*
              Sur Y2 :
              on conserve le résultat
              mais on ferme le clavier.
            */

            input.blur();

          }

        }
      );

    });


    /*
      RESET
    */

    resetButton.addEventListener(
      "click",
      () => {

        inputs.forEach(
          input => input.value = ""
        );

        calculateDistance();

        inputs[0].focus();

      }
    );


    calculateDistance();

  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js");
    });
  }
</script>
</body>
</html>
